approval_policy = "never"
sandbox_mode = "danger-full-access"
model_reasoning_effort = "high"
web_search = "cached"
service_tier = "fast"

# gws (Google Workspace CLI): headless/SSH 環境では OS キーチェーンが使えないため
# ファイルバックエンドで認証情報を復号する。Codex が実行するコマンドへ env var を渡す。
[shell_environment_policy]
set = { GOOGLE_WORKSPACE_CLI_KEYRING_BACKEND = "file" }

[features]
fast_mode = true

[history]
persistence = "save-all"

[tui]
status_line = ["model-with-reasoning", "used-tokens", "five-hour-limit", "weekly-limit", "current-dir"]
notifications = ["agent-turn-complete","approval-requested"]

[tui.model_availability_nux]
"gpt-5.5" = 4

[projects."/Users/niki/ghq/github.com/co-cre/kajinuma-os"]
trust_level = "trusted"

