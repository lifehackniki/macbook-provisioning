approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "high"
web_search = "cached"
service_tier = "fast"

# workspace-write: 書き込み可能 = cwd + /tmp + writable_roots。それ以外は読み取り専用。
# ~/.codex/config.toml と rules が書き込み不可になり自己保護が成立する。
# workspace外への書き込みが必要な場合は on-request でCodexが承認を求めてくる。
[sandbox_workspace_write]
network_access = true  # offだと git push / API呼び出しが失敗する
writable_roots = [
  "/Users/niki/ghq/github.com/co-cre/makasete",
  "/Users/niki/ghq/github.com/co-cre/kajinuma-os",
  "/Users/niki/ghq/github.com/cocre-web-studio/makasete.co",
  "/Users/niki/ghq/github.com/co-cre/hermes",
]

# gws (Google Workspace CLI): headless/SSH 環境では OS キーチェーンが使えないため
# ファイルバックエンドで認証情報を復号する。Codex が実行するコマンドへ env var を渡す。
[shell_environment_policy]
set = { GOOGLE_WORKSPACE_CLI_KEYRING_BACKEND = "file" }

[features]
fast_mode = true

[history]
persistence = "save-all"

[tui]
# Claude Code の statusline と同じ並び: ディレクトリ > ブランチ > モデル+reasoning > ctx使用率
status_line = ["current-dir", "git-branch", "model-with-reasoning", "context-used"]
notifications = ["agent-turn-complete","approval-requested"]

[tui.model_availability_nux]
"gpt-5.5" = 4

[projects."/Users/niki/ghq/github.com/co-cre/kajinuma-os"]
trust_level = "trusted"

