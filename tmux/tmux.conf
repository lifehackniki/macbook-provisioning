# tmux.conf - minimal config for takt workflow

# Mouse support
set -g mouse on

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Status bar (catppuccin-mocha風)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S "
set -g status-right-length 60
set -g status-right "#[fg=#6c7086]^b c:新規 n:次 d:離脱 h:一覧 #[fg=#a6adc8]%H:%M "
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[fg=#f9e2af,bold] #I:#W "

# Scrollback (capture-pane用)
set -g history-limit 50000

# Fast escape
set -sg escape-time 10

# Renumber windows
set -g renumber-windows on

# チートシートメニュー (^b h) - キー選択でそのまま実行、q/Escで閉じる
bind h display-menu -T "#[align=centre] tmux操作 " -x C -y C \
    "新しいウィンドウ"   c  new-window \
    "次のウィンドウ"     n  next-window \
    "前のウィンドウ"     p  previous-window \
    "ウィンドウ一覧"     w  choose-window \
    "" \
    "左右に分割"         %  "split-window -h" \
    "上下に分割"         '"'  "split-window -v" \
    "ペイン移動"         o  "select-pane -t :.+" \
    "ペインを閉じる"     x  "confirm-before -p 'ペインを閉じる? (y/n)' kill-pane" \
    "" \
    "コピーモード(スクロール)" "[" copy-mode \
    "デタッチ(作業は継続)"     d  detach-client
