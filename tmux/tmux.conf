# tmux.conf - minimal config for takt workflow

# Mouse support
set -g mouse on

# --- コピペ（macOSクリップボード連携）---
# OSC52でターミナル経由でもクリップボードに送る（Ghostty/iTerm等で有効）
set -g set-clipboard on
# copy-modeをviキー操作に（h/j/k/l, v=選択開始, y=コピー）
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
# マウスでドラッグ選択 → 離した瞬間にpbcopyへコピー（コピーモードは維持しない）
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# ダブルクリックで単語、トリプルクリックで行を選択してコピー
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "pbcopy"

# True color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Claude Code: let tmux pass modified keys such as Shift+Enter through.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Status bar (catppuccin-mocha風)
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
# 左端はタブ（window）を詰めたいので session名(hostname)は出さない
set -g status-left ""
set -g status-left-length 1
set -g status-right-length 40
# 上側: session / window tabs → ヘルプ案内
# 10秒間隔: 下枠の使用量表示(#()の再評価)もこの間隔に連動する
set -g status-interval 10
set -g status-right "#[fg=#6c7086]Ctrl+b→h でhelp "
set -g window-status-format "#[fg=#6c7086] #I:#W "
set -g window-status-current-format "#[fg=#f9e2af,bold] #I:#W "
# ステータスバー上の window タブをクリックしたらその window へ移動する
bind -n MouseDown1Status select-window -t =

# 下側: Claude Code / Codex のアカウント・使用量 + active pane の実行コマンド
set -g pane-border-status bottom
set -g pane-border-format " #{?pane_active,#[fg=#a6e3a1]#(~/ghq/github.com/lifehackniki/macbook-provisioning/bin/tmux-usage.sh) #[fg=#6c7086]| ,}#[bold]#{pane_current_command}#[nobold] "
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#f9e2af,bold"
# アクティブなペインを目立たせる: ボーダーを太い二重線に、非アクティブペインは暗く沈める
set -g pane-border-lines heavy
set -g window-style "fg=#6c7086,bg=#181825"
set -g window-active-style "fg=#cdd6f4,bg=#1e1e2e"
# Ctrl+b → , でこのペインに名前を付ける
bind , command-prompt -p "ペイン名:" "select-pane -T '%%'"

# Ctrl+b → t で上部のタブ(window)に名前を付ける（例: 実作業 / ハーネス）
# 一度名前を付けるとそのタブは自動リネームされなくなり、名前が固定される
bind t command-prompt -p "タブ名:" "rename-window '%%'"

# Ctrl+b → v で左右分割（チートシートを開かず直接）。分割後に横幅を均等化
bind v split-window -h \; select-layout even-horizontal

# Ctrl+b → s で上下分割（デフォルトの " は押しづらいため。vim の v/s に合わせる）
bind s split-window -v

# Ctrl+b → r で設定を再読み込み（source-file）
bind r source-file ~/.tmux.conf \; display-message "tmux.conf を再読み込みしました"

# Scrollback (capture-pane用)
set -g history-limit 50000

# Fast escape
set -sg escape-time 10

# Renumber windows
set -g renumber-windows on

# チートシートメニュー (Ctrl+b → h)
# 表示中にキーを押すとそのまま実行される。普段は「Ctrl+b を押して離してから 各キー」
bind h display-menu -T "#[align=centre] チートシート（キーを押すと実行 / q で閉じる） " -x C -y C -- \
    "-#[nodim]── ウィンドウ（タブのようなもの）──" "" "" \
    "新しいウィンドウを開く"           c  new-window \
    "次のウィンドウへ切り替え"         n  next-window \
    "前のウィンドウへ切り替え"         p  previous-window \
    "ウィンドウを一覧から選ぶ"         w  choose-window \
    "" \
    "-#[nodim]── ペイン（画面の分割）──" "" "" \
    "画面を左右に分割する"             v  "split-window -h ; select-layout even-horizontal" \
    "画面を上下に分割する"             s  "split-window -v" \
    "隣のペインへ移動する"             o  "select-pane -t :.+" \
    "このペインに名前を付ける"         ,  "command-prompt -p 'ペイン名:' \"select-pane -T '%%'\"" \
    "今のペインを閉じる"               x  "confirm-before -p 'ペインを閉じる? (y/n)' kill-pane" \
    "" \
    "-#[nodim]── その他 ──" "" "" \
    "過去の出力をスクロールして見る"   "[" copy-mode \
    "設定を再読み込みする"             r  "source-file ~/.tmux.conf ; display-message '再読み込みしました'" \
    "tmuxから抜ける（作業は裏で継続）" d  detach-client
